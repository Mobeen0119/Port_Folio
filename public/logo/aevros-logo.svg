<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="20%" y1="80%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#5B7FFF"/>
      <stop offset="100%" stop-color="#A6B8FF"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B9EFF"/>
      <stop offset="100%" stop-color="#5B7FFF"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect x="2" y="2" width="196" height="196" rx="44" fill="#050507"/>
  <rect x="2" y="2" width="196" height="196" rx="44" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- outer shell: a kernel boundary with one edge deliberately broken open -->
  <g fill="none" stroke="url(#ringGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 170,100 L 135,160.6"/>
    <path d="M 135,160.6 L 65,160.6"/>
    <path d="M 65,160.6 L 30,100"/>
    <path d="M 30,100 L 65,39.4"/>
    <path d="M 65,39.4 L 135,39.4"/>
    <!-- edge from 135,39.4 to 170,100 intentionally omitted: the shell is open -->
  </g>

  <!-- inner core: the truth the shell was hiding -->
  <polygon points="128,100 114,124.2 86,124.2 72,100 86,75.8 114,75.8"
    fill="url(#coreGrad)" filter="url(#softGlow)"/>

  <!-- the answer, escaping through the opening -->
  <line x1="152.5" y1="69.7" x2="182.3" y2="52.5" stroke="url(#ringGrad)" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="182.3" cy="52.5" r="6.5" fill="#A6B8FF"/>
</svg>
